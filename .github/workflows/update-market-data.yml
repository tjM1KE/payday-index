name: Update monthly paper backtest

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 2 * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run data:update
      - run: npm test
      - name: Commit new completed month
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "payday-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add app/data/backtest.json scripts/data/universe.json
          git commit -m "data: update monthly paper backtest"
          git push
